<div class="page">
  <mat-card class="card">
    <span class="material-icons lock-icon">lock</span>
    <h1>{{ 'vacationUnlock.title' | translate: { vacation: vacationName() } }}</h1>
    <p class="hint">{{ 'vacationUnlock.hint' | translate }}</p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'vacationUnlock.passwordLabel' | translate }}</mat-label>
      <input
        matInput
        type="password"
        [(ngModel)]="password"
        (keyup.enter)="submit()"
        autofocus
      />
    </mat-form-field>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button
      mat-raised-button
      color="primary"
      class="submit-btn"
      [disabled]="!password || submitting()"
      (click)="submit()"
    >
      {{ (submitting() ? 'vacationUnlock.submittingButton' : 'vacationUnlock.submitButton') | translate }}
    </button>
  </mat-card>
</div>
