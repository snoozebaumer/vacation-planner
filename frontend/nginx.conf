# Cloudflare Tunnel terminates the real client IP as CF-Connecting-IP before
# the request ever reaches this container — without this, every visitor
# would appear to come from cloudflared's local loopback connection, and the
# backend's rate limiter would end up sharing one bucket across everyone.
# Falls back to the direct connection's address when accessed without
# Cloudflare in front (e.g. local dev on localhost).
map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
